- device_id: sample_roscore #device identifier. It is up to the designer to choose this name.
  class_name:  embedded.mas.bridges.ros.RosMaster
  microcontroller:
      id: ros1 #microcontroller identifier. It is up to the designer to choose this name.
      class_name: DefaultRos4EmbeddedMas
      connection_string: ws://localhost:9090 #connection with ROS
  
  perception_topics:
      - topic_name: /arduino/ultrasonic_sensor/distance
        topic_type: std_msgs/msg/Float32
        percept_name: ultrasonic
  actions:    
    service_request_actions:
      - action_name: move
        topic_name: /arduino/motor/command
        topic_type: std_msgs/msg/String

